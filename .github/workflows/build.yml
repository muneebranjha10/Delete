name: Build App Delete FX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          javac -d /tmp/deletefx app/src/main/java/dev/s23hype/deletefx/ParticleMath.java tests/ParticleMathTest.java
          java -cp /tmp/deletefx dev.s23hype.deletefx.ParticleMathTest
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AppDeleteFX-0.2-alpha
          path: app/build/outputs/apk/debug/app-debug.apk
